<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodrome</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🍅</text></svg>">
</head>
<body>
<main class="app">

  <header class="bar">
    <span class="brand">🍅 pomodrome</span>
    <span class="status" id="status" data-state="loading">connecting…</span>
    <button class="ghost" id="invite" type="button">Copy invite link</button>
  </header>

  <p class="people" id="people"></p>

  <section class="stage">
    <p class="label" id="label">Pick a timer</p>
    <p class="clock" id="clock">25:00</p>
    <p class="note" id="note">&nbsp;</p>
  </section>

  <div class="track" id="track" role="progressbar" aria-label="Time remaining"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
    <div class="fill" id="fill"></div>
  </div>

  <div class="controls">
    <button class="primary" id="toggle" type="button" disabled>Start</button>
    <button class="secondary" id="reset" type="button" disabled>Reset</button>
  </div>

  <section class="presets" aria-label="Timers">
    <div class="chips" id="chips"></div>
    <form class="add" id="add">
      <input id="add-name" type="text" placeholder="Timer name" maxlength="24" required>
      <input id="add-mins" type="number" placeholder="min" min="1" max="600" step="1" required>
      <button type="submit">Add</button>
    </form>
  </section>

  <p class="worked" id="worked"></p>

  <footer class="foot">
    <span id="mode-note"></span>
  </footer>

  <div class="gate" id="gate" hidden>
    <form class="gate-card" id="gate-form">
      <label class="gate-label" for="gate-name">What should we call you?</label>
      <input id="gate-name" type="text" maxlength="20" autocomplete="off"
             placeholder="Your name" required>
      <button type="submit">Join</button>
      <p class="gate-note">Just for this tab — close the page and you disappear.</p>
    </form>
  </div>

</main>
<script type="module" src="app.js"></script>
</body>
</html>
